version: 1
applications:
  - appRoot: stellara
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 18
            - npm ci
        build:
          commands:
            - env | grep -e NEXT
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
      buildEnvironment:
        environmentVariables:
          NEXT_TELEMETRY_DISABLED: '1'
